services:
  dnd_content.portrait_writer:
    class: Drupal\dnd_content\Service\PortraitWriter
    arguments:
      - '@entity_type.manager'
      - '@file.repository'
      - '@file_system'
  dnd_content.illustration_writer:
    class: Drupal\dnd_content\Service\IllustrationWriter
    arguments:
      - '@entity_type.manager'
      - '@file.repository'
      - '@file_system'
  dnd_content.story_arc_writer:
    class: Drupal\dnd_content\Service\StoryArcWriter
    arguments:
      - '@entity_type.manager'

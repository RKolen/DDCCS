name: Quality Gates

# Runs the same gates as ./check.sh, so CI and local development cannot drift.
#
# This exists because AGENTS.md documented the rules (10.00/10 pylint, zero
# mypy/Pylance errors, no checker suppressions) but nothing enforced them, and
# violations accumulated silently. A rule nothing enforces is not a rule.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python-gates:
    name: Python quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run static quality gates
        # --fast runs the static gates only: shell exec bits, no-suppressions,
        # pylint, mypy (src + tests), and pyright. Exits non-zero on any failure.
        #
        # The test suite is deliberately excluded. Parts of it are integration
        # tests that need a live Ollama and a .env file (which is gitignored),
        # so it cannot run deterministically on a clean runner. Run the full
        # suite locally with ./check.sh before pushing.
        run: ./check.sh --fast
